services:
  rag_chatbot:
    environment:
      UV_PROJECT_ENVIRONMENT: /app/.venv
      PATH: /app/.venv/bin:/opt/venv/bin:/usr/local/bin:/usr/bin:/bin
    volumes:
      - .:/app:cached
    # The primary stack command and health check remain unchanged.
