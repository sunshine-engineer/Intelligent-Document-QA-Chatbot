name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --all-groups --frozen
      - name: Check formatting
        run: uv run black --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check core modules
        run: uv run mypy
      - name: Test with coverage gate
        run: >-
          uv run python -m pytest --cov --cov-report=term-missing
          --cov-report=xml:coverage.xml
      - name: Smoke-test Streamlit startup without providers
        run: uv run python scripts/streamlit_smoke.py
      - name: Run deterministic offline retrieval evaluation
        run: >-
          uv run python evaluation/run_offline.py
          --output evaluation-results.json
      - name: Upload quality evidence
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence
          path: |
            coverage.xml
            evaluation-results.json

  live-provider-smoke:
    # Secrets are intentionally not referenced in a job-level condition: GitHub
    # Actions does not support that context there and otherwise creates no jobs.
    # The repository variable is the explicit opt-in; the script validates that
    # the required secrets are present without ever printing them.
    if: ${{ vars.RUN_LIVE_PROVIDER_CHECKS == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
      - run: uv sync --all-groups --frozen
      - name: Exercise configured Groq and Ollama providers without logging credentials
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OLLAMA_SMOKE_URL: ${{ secrets.OLLAMA_SMOKE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
        run: uv run python scripts/live_provider_smoke.py
